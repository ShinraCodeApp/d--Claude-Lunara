<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'PlayfairFallback';
    src: local('Playfair Display'), local('Georgia');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #0d0118;
  }
  .canvas {
    width: 1024px;
    height: 500px;
    position: relative;
    background: radial-gradient(circle at 78% 30%, #2a0a4d 0%, #1a0533 35%, #0d0118 75%);
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  /* Subtle stars */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
  }
  /* Logo */
  .logo {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 470px;
    height: 470px;
    border-radius: 36px;
    box-shadow: 0 0 90px rgba(168, 85, 247, 0.45);
    object-fit: cover;
  }
  /* Text block */
  .textBlock {
    position: relative;
    z-index: 2;
    padding-left: 70px;
    width: 520px;
  }
  .tagline {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 40px;
    line-height: 1.35;
    color: #f3e8ff;
    text-shadow: 0 2px 18px rgba(168, 85, 247, 0.6);
  }
  .tagline .accent {
    color: #c4b5fd;
  }
  .sub {
    margin-top: 22px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 19px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #a78bca;
  }
  .moonline {
    margin-top: 28px;
    display: flex;
    gap: 10px;
    font-size: 22px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="canvas">
    <!-- decorative stars -->
    <div class="star" style="width:3px;height:3px;left:60px;top:60px;"></div>
    <div class="star" style="width:2px;height:2px;left:140px;top:120px;"></div>
    <div class="star" style="width:4px;height:4px;left:90px;top:380px;"></div>
    <div class="star" style="width:2px;height:2px;left:220px;top:60px;"></div>
    <div class="star" style="width:3px;height:3px;left:480px;top:90px;"></div>
    <div class="star" style="width:2px;height:2px;left:40px;top:250px;"></div>
    <div class="star" style="width:3px;height:3px;left:300px;top:430px;"></div>
    <div class="star" style="width:2px;height:2px;left:560px;top:380px;"></div>

    <div class="textBlock">
      <div class="tagline">Tu ciclo.<br><span class="accent">Tu bienestar.</span></div>
      <div class="sub">Salud femenina &amp; ciclo menstrual</div>
      <div class="moonline">🌑 🌒 🌓 🌔 🌕 🌖 🌗 🌘</div>
    </div>

    <img class="logo" src="logo.png" alt="Lunara" />
  </div>
</body>
</html>
